[project]
name = "orakul-backend"
version = "0.1.0"
description = "Биржа репутации предсказателей — модульный монолит (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Валидация формата email (pydantic EmailStr) — вход по одноразовой ссылке.
    "email-validator>=2.0",
    # SMTP поверх asyncio: письмо со ссылкой входа (см. app/shared/mail).
    "aiosmtplib>=3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "PyJWT>=2.8",
    # Верхняя граница < 47: prebuilt aarch64-колесо cryptography 49.x падает с
    # SIGILL (illegal instruction) в arm64-VM Docker Desktop. 42–46 работают.
    "cryptography>=42.0,<47",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Закреплены минорной границей: CI ставит latest без lock-файла, и дрейф
    # версий (locally 1.10/0.5 vs CI 2.3/0.16) уже приводил к расхождению
    # находок между локалью и CI. Обновлять сознательно, разбирая новые
    # находки в обеих средах разом.
    "mypy>=2.3,<3",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
